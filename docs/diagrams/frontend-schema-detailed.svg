<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200" font-family="Helvetica,Arial,sans-serif" font-size="12">
<defs>
<marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#444"/></marker>
<marker id="r" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#c0392b"/></marker>
<style>
.t{font-weight:700;font-size:13.5px;fill:#111}
.s{font-size:11.5px;fill:#333}
.m{font-family:Menlo,Consolas,monospace;font-size:10.5px;fill:#222}
.lbl{font-size:11px;fill:#555;font-style:italic}
.sec{font-weight:700;font-size:15px;fill:#222}
.h1{font-weight:700;font-size:24px;fill:#111}
.h2{font-size:12.5px;fill:#555;font-style:italic}
path.f{stroke:#444;stroke-width:1.5;fill:none;marker-end:url(#a)}
path.no{stroke:#c0392b;stroke-width:1.5;fill:none;marker-end:url(#r);stroke-dasharray:6 3}
</style></defs>
<rect width="1600" height="1200" fill="#fff"/>
<text x="28" y="50" class="h1">Sunroof · frontend — one object in, three renderers out, a globe on top later</text>
<text x="28" y="72" class="h2">Web SPA (Vite + React 19 + TS + Tailwind). Talks only to the camera backend, never to a camera host directly.</text>
<g transform="translate(0.0,88) scale(1.0000) translate(0,-88)">
<rect x="28" y="88" width="1544" height="135.5" rx="10" fill="#f7f7f7" stroke="#888" stroke-width="1.2"/>
<text x="42.0" y="109.0" class="sec" >sunroof/camera backend (FastAPI) — read-only for the frontend</text>
<rect x="42.0" y="132.0" width="288.8" height="77.5" rx="8" style="fill:#f4f4f4;stroke:#888;stroke-dasharray:5 3;stroke-width:1.4"/>
<text x="54.0" y="159.0" class="t" >GET /feed</text>
<text x="54.0" y="173.5" class="s" >ranked Footage[] across all active events ·</text>
<text x="54.0" y="188.0" class="s" >poll 60 s · fixture fallback if VITE_API_BASE</text>
<text x="54.0" y="202.5" class="s" >unset</text>
<rect x="348.8" y="132.0" width="288.8" height="63.0" rx="8" style="fill:#f4f4f4;stroke:#888;stroke-dasharray:5 3;stroke-width:1.4"/>
<text x="360.8" y="159.0" class="t" >GET /events/{id}/footage</text>
<text x="360.8" y="173.5" class="s" >all candidates for one event (globe</text>
<text x="360.8" y="188.0" class="s" >drill-down)</text>
<rect x="655.6" y="132.0" width="288.8" height="63.0" rx="8" style="fill:#f4f4f4;stroke:#888;stroke-dasharray:5 3;stroke-width:1.4"/>
<text x="667.6" y="159.0" class="t" >GET /stream (SSE)</text>
<text x="667.6" y="173.5" class="s" >footage.new / replaced / expired → invalidate</text>
<text x="667.6" y="188.0" class="s" >query keys, never mutate UI</text>
<rect x="962.4" y="132.0" width="288.8" height="63.0" rx="8" style="fill:#f4f4f4;stroke:#888;stroke-dasharray:5 3;stroke-width:1.4"/>
<text x="974.4" y="159.0" class="t" >GET /proxy/{camera}/…</text>
<text x="974.4" y="173.5" class="s" >frames, HLS playlists, posters — same origin,</text>
<text x="974.4" y="188.0" class="s" >CORS-free, camera URLs hidden</text>
<rect x="1269.2" y="132.0" width="288.8" height="63.0" rx="8" style="fill:#fafafa;stroke:#999;stroke-dasharray:3 3;stroke-width:1.4"/>
<text x="1281.2" y="159.0" class="t" >GET /cameras.geojson</text>
<text x="1281.2" y="173.5" class="s" >lat/lon of every catalog camera → globe dots</text>
<text x="1281.2" y="188.0" class="s" >· join event.type/place/rarity into Footage</text>
<rect x="28" y="257.5" width="1544" height="135.5" rx="10" fill="#f2faff" stroke="#1890ff" stroke-width="1.2"/>
<text x="42.0" y="278.5" class="sec" >The one object: Footage (src/lib/types.ts — mirrors backend, no adapters)</text>
<path class="f" d="M800.0,225.5 L800.0,255.5"/>
<text x="806.0" y="236.5" class="lbl" >JSON</text>
<rect x="42.0" y="301.5" width="1516.0" height="77.5" rx="8" style="fill:#e6f7ff;stroke:#1890ff;stroke-width:1.4"/>
<text x="54.0" y="328.5" class="t" >Footage</text>
<text x="54.0" y="343.0" class="m" >{ event_id, camera_id, rank, verified, media: { kind: 'image'|'hls'|'iframe', src, poster?, refresh_s?, expires_at?, width?, height? }, verdict?: { event_visible, confidence, quality, caption }, why, camera: { name, provider,</text>
<text x="54.0" y="357.5" class="m" >lat, lon, bearing?, source_url }, frame_ts, hold_until, event: { type, place?, rarity?, lat, lon, t0, t1 } }</text>
<text x="54.0" y="372.0" class="s" >Card, cycler, globe pin and evidence panel all take the same prop; media.kind is the only switch in the whole UI</text>
<rect x="28" y="427.0" width="1544" height="475.5" rx="10" fill="#f7f7f7" stroke="#333" stroke-width="1.2"/>
<text x="42.0" y="448.0" class="sec" >frontend SPA — iteration 1</text>
<path class="f" d="M800.0,395.0 L800.0,425.0"/>
<rect x="42.0" y="471.0" width="749.0" height="63.0" rx="8" style="fill:#fff;stroke:#333;stroke-width:1.4"/>
<text x="54.0" y="498.0" class="t" >api.ts</text>
<text x="54.0" y="512.5" class="s" >useFeed() → TanStack Query ['feed'] · useStream() → EventSource · mediaUrl() prefixes API_BASE</text>
<text x="54.0" y="527.0" class="s" >no API_BASE ⇒ fixtures/feed.json (offline demo)</text>
<rect x="809.0" y="471.0" width="749.0" height="63.0" rx="8" style="fill:#fff;stroke:#333;stroke-width:1.4"/>
<text x="821.0" y="498.0" class="t" >events.ts · time.ts</text>
<text x="821.0" y="512.5" class="s" >filter chips: all · sunrise · sunset · storms … (fog + undercast one chip)</text>
<text x="821.0" y="527.0" class="s" >still → 'frame 05:11 UTC · 37 min ago' · stream → 'delay ≈ 30 s'</text>
<rect x="42.0" y="568.0" width="1516.0" height="48.5" rx="8" style="fill:#fff;stroke:#333;stroke-width:1.4"/>
<text x="54.0" y="595.0" class="t" >App.tsx + Header.tsx</text>
<text x="54.0" y="609.5" class="s" >filter → visible = feed.filter(type).slice(0,4) → current; header: title · event select · fixture/live/SSE dot</text>
<path class="f" d="M800.0,536.0 L800.0,566.0"/>
<rect x="42.0" y="650.5" width="749.0" height="48.5" rx="8" style="fill:#fff;stroke:#333;stroke-width:1.4"/>
<text x="54.0" y="677.5" class="t" >Cycler.tsx</text>
<text x="54.0" y="692.0" class="s" >auto-advance 20 s, pauses on hover, a11y dots</text>
<rect x="809.0" y="650.5" width="749.0" height="48.5" rx="8" style="fill:#fff;stroke:#333;stroke-width:1.4"/>
<text x="821.0" y="677.5" class="t" >FootageCard.tsx</text>
<text x="821.0" y="692.0" class="s" >hero media · type chip · place · time/delay · VLM caption · 1-line 'what is this' · attribution · verified · why-this-camera</text>
<path class="f" d="M800.0,618.5 L800.0,648.5"/>
<rect x="42.0" y="733.0" width="1516.0" height="44.0" rx="8" style="fill:#fff;stroke:#333;stroke-width:1.4"/>
<text x="54.0" y="760.0" class="t" >FootageMedia.tsx (switch on media.kind)</text>
<path class="f" d="M800.0,701.0 L800.0,731.0"/>
<rect x="42.0" y="811.0" width="493.3" height="77.5" rx="8" style="fill:#f0fff0;stroke:#389e0d;stroke-width:1.4"/>
<text x="54.0" y="838.0" class="t" >'image' → ImageMedia</text>
<text x="54.0" y="852.5" class="s" >&lt;img&gt; re-fetched every refresh_s, cache-bust ?t=…, keep old frame until new one</text>
<text x="54.0" y="867.0" class="s" >loads</text>
<text x="54.0" y="881.5" class="s" >IEM, Windy, DOT stills (~90 % of catalog)</text>
<rect x="553.3" y="811.0" width="493.3" height="77.5" rx="8" style="fill:#fff7e6;stroke:#d48806;stroke-width:1.4"/>
<text x="565.3" y="838.0" class="t" >'hls' → HlsMedia</text>
<text x="565.3" y="852.5" class="s" >&lt;video&gt; native HLS on Safari, lazy hls.js elsewhere; muted, autoplay, poster on</text>
<text x="565.3" y="867.0" class="s" >fatal error</text>
<text x="565.3" y="881.5" class="s" >DOT / 511 streams, Skyline</text>
<rect x="1064.7" y="811.0" width="493.3" height="63.0" rx="8" style="fill:#f9f0ff;stroke:#9254de;stroke-width:1.4"/>
<text x="1076.7" y="838.0" class="t" >'iframe' → IframeMedia</text>
<text x="1076.7" y="852.5" class="s" >poster first, click to open the third-party player; allow=autoplay;fullscreen</text>
<text x="1076.7" y="867.0" class="s" >Panomax, YouTube (not verifiable → unverified)</text>
<path class="f" d="M800.0,779.0 L800.0,809.0"/>
<rect x="28" y="936.5" width="1544" height="135.5" rx="10" fill="#fafafa" stroke="#999" stroke-width="1.2"/>
<text x="42.0" y="957.5" class="sec" >later iterations — same Footage, new consumers</text>
<rect x="42.0" y="980.5" width="749.0" height="77.5" rx="8" style="fill:#fafafa;stroke:#999;stroke-dasharray:3 3;stroke-width:1.4"/>
<text x="54.0" y="1007.5" class="t" >iteration 2 — the globe (react-globe.gl / three.js)</text>
<text x="54.0" y="1022.0" class="s" >pointsData = all cameras · ringsData = event centers · htmlElements ≤ 50 thumbnail pins · arcsData camera → event sightline</text>
<text x="54.0" y="1036.5" class="s" >click pin → setSelected(footage), card slides in; layout flips 'centered card' → 'globe + card'</text>
<text x="54.0" y="1051.0" class="s" >web not RN: hls.js / iframe / EventSource are free in a browser; one origin, one deploy</text>
<rect x="809.0" y="980.5" width="749.0" height="63.0" rx="8" style="fill:#fafafa;stroke:#999;stroke-dasharray:3 3;stroke-width:1.4"/>
<text x="821.0" y="1007.5" class="t" >iteration 3 — depth, if time</text>
<text x="821.0" y="1022.0" class="s" >evidence drawer: frame + VLM verdict + gate stats + weather trigger</text>
<text x="821.0" y="1036.5" class="s" >rarity badge · share link /e/{event_id} · PWA kiosk manifest · timeline scrubber over hold_until</text>
</g>
</svg>
