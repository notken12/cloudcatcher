[project]
name = "cloudcatcher"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "astral>=3.2",
    "boto3>=1.43.98",
    "cfgrib>=0.9.15.1",
    "eccodeslib>=2.48.3.28",
    "h5py>=3.16.0",
    "netcdf4>=1.7.4",
    "numpy>=2.5.3",
    "pillow>=12.3.0",
    "pygrib>=2.1.8",
    "requests>=2.34.2",
    "scipy>=1.18.1",
    "xarray>=2026.7.0",
]

[project.optional-dependencies]
# SegFormer sky-fraction filter (camera_ken/sky_fraction.py); heavy, and torch has no Intel-mac wheels
sky = [
    "torch>=2.14.0",
    "torchvision>=0.29.0",
    "transformers>=5.17.0",
]
