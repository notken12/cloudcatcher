# Ledger of every camera source probed for the catalog, added or not.
#
# One entry per source. Meant to be re-checked mechanically (a later agent/job can loop
# over `rejected` / `needs_key` / `retry` entries, re-run `probe`, and flip `status`
# when a source becomes usable). Narrative context lives in sources.md.
#
# status:  added      - adapter exists (see `adapter`), rows in the catalog
#          needs_key  - endpoint alive but wants a free key/token we don't hold
#          rejected   - probed, unusable for the stated reason (re-probe with `probe`)
#          retry      - probably usable, transient/incomplete result during probe
#          later      - usable in principle but needs non-trivial work (HTML scrape etc.)
#          never      - ToS/ethics; do not re-probe
# probe:   what to run to re-verify. `expect` is the observation that would flip the verdict.
# All HTTP results below were observed live on 2026-09-20 from a US datacentre egress
# (relevant for the Cloudflare / geo-blocked entries).

