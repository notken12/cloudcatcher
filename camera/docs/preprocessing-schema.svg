<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1070" viewBox="0 0 1400 1070" font-family="Helvetica, Arial, sans-serif" font-size="13">
<defs>
  <marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker>
  <style>
    .box{fill:#fff;stroke:#333;stroke-width:1.4;rx:8}
    .src{fill:#eef5ff;stroke:#3b6fb6}
    .job{fill:#fff7e6;stroke:#d48806}
    .db{fill:#f0fff0;stroke:#389e0d}
    .q{fill:#fdf0ff;stroke:#9254de}
    .ext{fill:#f5f5f5;stroke:#888;stroke-dasharray:5 3}
    .t{font-weight:700;font-size:14px}
    .s{font-size:11.5px;fill:#333}
    .m{font-family:Menlo,monospace;font-size:11px;fill:#222}
    .lbl{font-size:11px;fill:#555;font-style:italic}
    line,path.f{stroke:#444;stroke-width:1.4;fill:none;marker-end:url(#a)}
  </style>
</defs>

<text x="20" y="30" font-size="20" font-weight="700">Sunroof · camera preprocessing → mini-DB → query</text>
<text x="20" y="50" class="lbl">Left→right: offline/ scheduled (orange) builds the catalog (green); the backend calls find_cameras() at event time (purple). Grey = other teams' components.</text>

<!-- ===== column 1: sources ===== -->
<text x="20" y="90" class="t">1 · Sources (sources.md)</text>
<rect x="20" y="100" width="250" height="88" class="box src"/>
<text x="30" y="120" class="t">Tier 1 · JSON catalog + JPEG</text>
<text x="30" y="138" class="s">Caltrans, ALERTCalifornia, NY/ON 511,</text>
<text x="30" y="153" class="s">Digitraffic FI, Iceland, Panomax,</text>
<text x="30" y="168" class="s">foto-webcam, NDBC, PhenoCam, IEM, NPS</text>
<text x="30" y="183" class="lbl">~12k views · many carry heading</text>

<rect x="20" y="200" width="250" height="70" class="box src"/>
<text x="30" y="220" class="t">Tier 2 · needs free key</text>
<text x="30" y="238" class="s">Windy (~70k, rest of world), CARS states,</text>
<text x="30" y="253" class="s">WSDOT, FAA WeatherCams (token)</text>

<rect x="20" y="282" width="250" height="70" class="box src"/>
<text x="30" y="302" class="t">Tier 3 · manual.yaml</text>
<text x="30" y="320" class="s">YouTube 24/7 IDs, Explore.org, Roundshot,</text>
<text x="30" y="335" class="s">all-sky hobby cams, aurora cams</text>

<!-- ===== column 2: adapters ===== -->
<text x="320" y="90" class="t">2 · Adapters (one per source)</text>
<rect x="320" y="100" width="250" height="252" class="box job"/>
<text x="330" y="120" class="m">catalog()  → RawCamera[]</text>
<text x="330" y="136" class="m">normalize() → Camera row</text>
<text x="330" y="152" class="m">fetch_frame(cam, ts?) → Frame</text>
<path d="M330,162 L560,162" stroke="#d48806" stroke-width="0.8" fill="none"/>
<text x="330" y="180" class="s">Edge cases handled here:</text>
<text x="330" y="196" class="s">• gzip / identity headers / empty key</text>
<text x="330" y="211" class="s">• placeholder "cam offline" JPEG → sha1 set</text>
<text x="330" y="226" class="s">• redirect-to-HTML, &lt;3 KB, frozen frame</text>
<text x="330" y="241" class="s">• per-host rate limit (≤1 rps hobby sites)</text>
<text x="330" y="256" class="s">• signed URLs (Windy) → resolve at display</text>
<text x="330" y="271" class="s">• tz-less timestamps → EXIF → fetch time</text>
<text x="330" y="286" class="s">• dedupe across sources (lat,lon,az±15°)</text>
<text x="330" y="306" class="s">Heading from: numeric (Panomax/PhenoCam/</text>
<text x="330" y="321" class="s">IEM/FAA) · text "N/looking west/séð til</text>
<text x="330" y="336" class="s">vesturs" · road geometry · PTZ → unknown</text>

<!-- ===== column 3: enrichment ===== -->
<text x="620" y="90" class="t">3 · Enrich (once per camera)</text>
<rect x="620" y="100" width="260" height="120" class="box job"/>
<text x="630" y="120" class="t">Coverage = viewing cone</text>
<text x="630" y="138" class="m">az, hfov, elev_min, elev_max, conf</text>
<text x="630" y="156" class="s">numeric from catalog (Panomax, PhenoCam, IEM),</text>
<text x="630" y="171" class="s">8-pt compass from text (±22.5°), road geometry,</text>
<text x="630" y="186" class="s">or unknown (PTZ) → no bearing filter, score ×0.6</text>
<text x="630" y="204" class="lbl">nothing precomputed; test evaluated per query (②)</text>

<rect x="620" y="232" width="260" height="60" class="box job"/>
<text x="630" y="252" class="t">Static enrich</text>
<text x="630" y="270" class="s">tz (timezonefinder) · alt_m (SRTM) · license ·</text>
<text x="630" y="285" class="s">sky_frac heuristic on one daytime frame</text>

<!-- wedge illustration -->
<text x="700" y="650" class="t">How step ② works · annular-sector test</text>
<g transform="translate(790,785)">
  <circle cx="0" cy="0" r="4" fill="#333"/>
  <path d="M-16,-25 L-50,-78 A93,93 0 0 1 50,-78 L16,-25 A30,30 0 0 0 -16,-25 Z" fill="#9254de" fill-opacity="0.18" stroke="#9254de"/>
  <path d="M0,0 L0,-96" stroke="#9254de" stroke-dasharray="3 3" fill="none"/>
  <text x="5" y="-86" class="lbl">azimuth</text>
  <text x="-48" y="-40" class="lbl">hfov</text>
  <text x="20" y="-108" class="lbl">d_max = h/tan(elev_min), ≤ R_cap</text>
  <text x="22" y="-18" class="lbl">d_min = h/tan(elev_max)</text>
  <circle cx="25" cy="-60" r="5" fill="#d4380d"/><text x="32" y="-63" class="lbl">event ✓</text>
  <circle cx="0" cy="-14" r="4" fill="#aaa"/>
  <circle cx="-70" cy="-15" r="5" fill="#aaa"/><text x="-115" y="-2" class="lbl">event ✗</text>
</g>
<text x="960" y="700" class="lbl">Feature at altitude h over ground distance d appears at elevation</text>
<text x="960" y="714" class="m">α = atan(h/d) − d/(2·R_earth)</text>
<text x="960" y="728" class="lbl">visible iff |bearing − az| ≤ hfov/2 + δ(conf)  and  elev_min ≤ α ≤ elev_max</text>
<text x="960" y="742" class="lbl">⇒ annulus d_min..d_max; a horizon cam can't see an anvil overhead (grey dot).</text>
<text x="960" y="756" class="lbl">h per type: anvil 12 km, mammatus 4, aurora 110–250, fog 0.2; sunset/rainbow use sun az.</text>
<text x="960" y="770" class="lbl">R_cap (storm 150, aurora 600 km) = visibility judgment, not geometry.</text>

<!-- ===== column 4: catalog ===== -->
<text x="930" y="90" class="t">4 · Mini-DB</text>
<rect x="930" y="100" width="450" height="200" class="box db"/>
<text x="940" y="120" class="t">cameras.parquet  (pandas, one row per view)</text>
<text x="940" y="140" class="m">id source source_kind name lat lon alt_m tz</text>
<text x="940" y="155" class="m">azimuth_deg hfov_deg elev_min_deg elev_max_deg heading_conf</text>
<text x="940" y="170" class="m">sky_frac</text>
<text x="940" y="185" class="m">night_ok all_sky ptz over_water</text>
<text x="940" y="200" class="m">image_url stream_url embed_url page_url refresh_s</text>
<text x="940" y="215" class="m">history_kind history_template history_depth_days</text>
<text x="940" y="230" class="m">license attribution embed_allowed</text>
<text x="940" y="245" class="m">last_frame_ts fail_streak health quality_score night_usable_frac</text>
<text x="940" y="268" class="t">camera_samples.parquet</text>
<text x="940" y="284" class="m">camera_id ts url sha1 bytes luminance solar_elev vlm_label</text>

<rect x="970" y="316" width="410" height="60" class="box job"/>
<text x="980" y="336" class="t">Scheduled jobs</text>
<text x="980" y="353" class="s">daily: re-pull catalogs, upsert, 3 misses → dead</text>
<text x="980" y="368" class="s">10 min: probe frame → last_frame_ts, sha1, luminance → health</text>

<!-- arrows top row -->
<line x1="270" y1="144" x2="318" y2="144"/>
<line x1="270" y1="235" x2="318" y2="235"/>
<line x1="270" y1="317" x2="318" y2="317"/>
<line x1="570" y1="160" x2="618" y2="160"/>
<line x1="570" y1="262" x2="618" y2="262"/>
<line x1="880" y1="160" x2="928" y2="160"/>
<line x1="880" y1="262" x2="928" y2="262"/>
<path class="f" d="M1175,376 L1175,418 L445,418 L445,354"/>
<text x="720" y="413" class="lbl">health job re-uses fetch_frame()</text>

<!-- ===== bottom: query time ===== -->
<path d="M20,445 L1380,445" stroke="#bbb" fill="none"/>
<text x="20" y="470" class="t">5 · Query time (backend calls us every ~10 min per event)</text>

<rect x="20" y="490" width="230" height="90" class="box ext"/>
<text x="30" y="510" class="t">Event (other Devin)</text>
<text x="30" y="528" class="m">type lat lon radius_km</text>
<text x="30" y="543" class="m">t_start t_end severity</text>
<text x="30" y="561" class="s">sunrise sunset thunderstorm lightning</text>
<text x="30" y="575" class="s">mammatus lenticular fog/undercast aurora rainbow</text>

<rect x="300" y="490" width="330" height="260" class="box q"/>
<text x="310" y="510" class="t">find_cameras(event, k)</text>
<text x="310" y="530" class="s">① bbox prefilter → haversine distance ≤ R_cap(type)</text>
<text x="310" y="546" class="s">② annular-sector test: bearing∈az±hfov/2, d_min≤d≤d_max</text>
<text x="310" y="562" class="s">③ per-type rule, e.g.</text>
<text x="320" y="577" class="m">sunset: sun_az(t)∈az±hfov/2, sun_el∈[-6,6]</text>
<text x="320" y="591" class="m">rainbow: antisolar az, sun_el∈(0,42)</text>
<text x="320" y="605" class="m">undercast: cam.alt_m &gt; fog_top</text>
<text x="320" y="619" class="m">aurora: night_ok, sun_el&lt;-12, R≤600 km</text>
<text x="310" y="638" class="s">④ night gate (astral): sun_el&gt;-6 all · -6..-18 twilight</text>
<text x="320" y="652" class="s">night_ok or ×0.5 · &lt;-18 night_ok only (lightning exempt)</text>
<text x="310" y="671" class="s">⑤ health == live (now − last_frame_ts ≤ 2·refresh_s)</text>
<text x="310" y="690" class="s">⑥ score = geo_fit + freshness + sky_frac + source_prior</text>
<text x="320" y="704" class="s">+ night_mult − dup_penalty</text>
<text x="310" y="723" class="s">⑦ return top 3k hits with reason string + fetch URL</text>
<text x="310" y="740" class="lbl">t in the past → history_template / previousImageURL (replay)</text>

<rect x="690" y="490" width="230" height="120" class="box job"/>
<text x="700" y="510" class="t">Frame fetch + gating</text>
<text x="700" y="528" class="s">JPEG · HLS/YouTube → ffmpeg 1 frame</text>
<text x="700" y="543" class="s">· embed → screenshot</text>
<text x="700" y="561" class="s">sha1 dedupe, luminance gate, sky crop,</text>
<text x="700" y="576" class="s">cache verdict per (cam, 10-min bucket)</text>
<text x="700" y="598" class="lbl">→ Token Company: tokens saved</text>

<rect x="980" y="490" width="180" height="120" class="box ext"/>
<text x="990" y="510" class="t">VLM gate (OpenAI)</text>
<text x="990" y="528" class="m">usable: bool</text>
<text x="990" y="543" class="m">sky_visible: 0..1</text>
<text x="990" y="558" class="m">event_visible: enum</text>
<text x="990" y="573" class="m">night: bool</text>
<text x="990" y="598" class="lbl">verdict → camera_samples</text>

<rect x="1220" y="490" width="160" height="120" class="box ext"/>
<text x="1230" y="510" class="t">Frontend</text>
<text x="1230" y="528" class="s">top-k passing pairs</text>
<text x="1230" y="543" class="s">iframe / &lt;video&gt; / img</text>
<text x="1230" y="558" class="s">via proxy (CORS)</text>
<text x="1230" y="573" class="s">attribution + "why"</text>

<line x1="250" y1="535" x2="298" y2="535"/>
<line x1="630" y1="550" x2="688" y2="550"/>
<line x1="920" y1="550" x2="978" y2="550"/>
<line x1="1160" y1="550" x2="1218" y2="550"/>
<path class="f" d="M945,300 L945,470 L500,470 L500,488"/>
<text x="560" y="465" class="lbl">reads cameras.parquet</text>
<path class="f" d="M1070,610 C1070,700 1300,760 1300,300"/>
<text x="1150" y="680" class="lbl">VLM verdicts feed back → night_ok, quality_score</text>

<!-- historical -->
<rect x="20" y="800" width="610" height="110" class="box db"/>
<text x="30" y="820" class="t">6 · Historical / backtest (Voloridge angle)</text>
<text x="30" y="840" class="s">Archives with per-frame time (and often heading): IEM 2003→ (5-min, heading logged), PhenoCam 2008→ (30-min),</text>
<text x="30" y="855" class="s">foto-webcam (years), Caltrans last-12, FAA/Digitraffic 24 h. fetch_frame(cam, ts) fills history_template.</text>
<text x="30" y="875" class="s">replay/ fixtures: Front Range mammatus day · Lapland aurora night · Alpine undercast morning · Miami thunderstorm</text>
<text x="30" y="895" class="lbl">same find_cameras() with t_end in the past → demo never depends on tonight's weather</text>

<rect x="690" y="800" width="690" height="110" class="box ext"/>
<text x="700" y="820" class="t">Sponsor seam</text>
<text x="700" y="840" class="s">pandas/Parquet is canonical. `backend=` switch in find_cameras() lets an Elastic mirror (geo_shape sectors + function_score) be</text>
<text x="700" y="855" class="s">added on day 2 only if the events team adopts Elastic for the messy real-time streams — never as source of truth.</text>
<text x="700" y="875" class="s">OpenAI = VLM gate · Token Company = frame gating/caching metrics · Voloridge = camera_samples + archives → rarity/backtest.</text>

<text x="20" y="1000" class="t">Build order</text>
<text x="20" y="1020" class="s">① uv project, models, Parquet schema, manual.yaml (10 cams) → find_cameras() end-to-end in hour 1 for the backend Devin</text>
<text x="20" y="1036" class="s">② adapters: caltrans → cars → panomax → digitraffic → iceland → alertca → fotowebcam → ndbc → iem → phenocam → windy</text>
<text x="20" y="1052" class="s">③ health job + astral night logic + sky_frac    ④ FAA token, replay fixtures, Elastic mirror if time</text>
</svg>
