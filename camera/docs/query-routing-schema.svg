<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1160" viewBox="0 0 1500 1160" font-family="Helvetica,Arial,sans-serif" font-size="12">
<defs>
  <marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#444"/></marker>
  <marker id="r" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#c0392b"/></marker>
  <style>
    .box{fill:#fff;stroke:#333;stroke-width:1.4;rx:8}
    .ext{fill:#f5f5f5;stroke:#888;stroke-dasharray:5 3}
    .q{fill:#fdf0ff;stroke:#9254de}
    .db{fill:#f0fff0;stroke:#389e0d}
    .gate{fill:#fff7e6;stroke:#d48806}
    .vlm{fill:#e6f7ff;stroke:#1890ff}
    .route{fill:#e6fffb;stroke:#13c2c2}
    .fail{fill:#fff1f0;stroke:#c0392b}
    .later{fill:#fafafa;stroke:#999;stroke-dasharray:3 3}
    .t{font-weight:700;font-size:14px}
    .s{font-size:11.5px;fill:#333}
    .m{font-family:Menlo,Consolas,monospace;font-size:10.5px;fill:#222}
    .lbl{font-size:11px;fill:#555;font-style:italic}
    .red{fill:#c0392b}
    line,path.f{stroke:#444;stroke-width:1.4;fill:none;marker-end:url(#a)}
    path.no{stroke:#c0392b;stroke-width:1.4;fill:none;marker-end:url(#r);stroke-dasharray:6 3}
  </style>
</defs>

<text x="20" y="28" font-size="20" font-weight="700">Sunroof · event → which camera → is the frame real → what the frontend gets</text>
<text x="20" y="48" class="lbl">Top to bottom = one call of resolve_footage(event, k=3, deadline 30 s). Solid arrows = success path, red dashed = a status back to the weather backend. Grey = other teams. Dotted grey = later.</text>

<!-- ============ ROW 0: inputs ============ -->
<rect x="20" y="70" width="330" height="110" class="box ext"/>
<text x="32" y="92" class="t">Weather backend (Ken)</text>
<text x="32" y="112" class="m">Event{id, type, lat, lon, radius_km,</text>
<text x="32" y="127" class="m">      t_start, t_end, severity, rarity,</text>
<text x="32" y="142" class="m">      evidence{fog_top_m, anvil_top_km, kp…},</text>
<text x="32" y="157" class="m">      region?: polygon}</text>
<text x="32" y="173" class="s">every ~10 min per live event · once per replay event</text>

<rect x="400" y="70" width="330" height="110" class="box db"/>
<text x="412" y="92" class="t">Mini-DB (preprocessed)</text>
<text x="412" y="112" class="m">cameras.parquet · one row per view</text>
<text x="412" y="127" class="s">lat lon alt_m tz · azimuth hfov elev_min/max heading_conf</text>
<text x="412" y="142" class="s">sky_frac night_ok all_sky ptz · image/stream/embed_url refresh_s</text>
<text x="412" y="157" class="s">health last_frame_ts quality_score · license embed_allowed</text>
<text x="412" y="173" class="m">camera_samples.parquet (sha1, luminance, vlm_label)</text>

<rect x="780" y="70" width="700" height="110" class="box q"/>
<text x="792" y="92" class="t">EventProfile table · one row per type (data, not code)</text>
<text x="792" y="110" class="m">geometry  h/R_cap  night_policy  require        prefer                 media, frames         hold</text>
<text x="792" y="125" class="m">thunderstorm annulus 12/150  twilight  live,elev_min≤10  30–100 km, sky_frac      jpeg 1        20 min</text>
<text x="792" y="139" class="m">undercast  above_layer –/30  twilight  alt_m&gt;fog_top    Panomax, hfov≥180        jpeg 1        30 min</text>
<text x="792" y="153" class="m">lightning  annulus  6/60    any       refresh≤60|hls    hls, IR, all_sky         hls burst 3–5 15 min</text>
<text x="792" y="167" class="m">sunset     sun_az   –/rad   any       heading exact,elev_min≤2  over_water, curated  jpeg re-fetch 3 min  … (9 rows)</text>

<!-- ============ ROW 1: find_cameras ============ -->
<rect x="20" y="220" width="1460" height="150" class="box q"/>
<text x="32" y="242" class="t">① find_cameras(event, profile, k) → top 3k candidates · vectorised pandas, ~10 ms</text>

<rect x="32" y="256" width="170" height="100" class="box"/>
<text x="42" y="274" class="s" font-weight="700">bbox → haversine</text>
<text x="42" y="290" class="s">d ≤ R_cap(type)</text>
<text x="42" y="304" class="s">or ≤ radius_km for</text>
<text x="42" y="318" class="s">point events (rainbow, fog)</text>
<text x="42" y="342" class="lbl">90k → ~500 rows</text>

<line x1="202" y1="306" x2="222" y2="306"/>
<rect x="224" y="256" width="250" height="100" class="box"/>
<text x="234" y="274" class="s" font-weight="700">geometry test (per profile)</text>
<text x="234" y="290" class="m">annulus: |b−az|≤hfov/2+δ, dmin≤d≤dmax</text>
<text x="234" y="304" class="m">sun_az / antisolar: sun ∈ az±hfov/2</text>
<text x="234" y="318" class="m">inside/above_layer: alt_m vs fog_top</text>
<text x="234" y="332" class="m">region: any pt of polygon in sector</text>
<text x="234" y="348" class="lbl">ptz/unknown heading: skip test, score ×0.6</text>

<line x1="474" y1="306" x2="494" y2="306"/>
<rect x="496" y="256" width="210" height="100" class="box"/>
<text x="506" y="274" class="s" font-weight="700">hard filters</text>
<text x="506" y="290" class="m">health == live</text>
<text x="506" y="304" class="m">profile.require (elev_min,</text>
<text x="506" y="318" class="m">  alt_m, refresh_s, heading…)</text>
<text x="506" y="332" class="m">replay: history covers t</text>

<line x1="706" y1="306" x2="726" y2="306"/>
<rect x="728" y="256" width="230" height="100" class="box"/>
<text x="738" y="274" class="s" font-weight="700">night gate (astral, at query time)</text>
<text x="738" y="290" class="m">sun_el &gt; −6   all cams</text>
<text x="738" y="304" class="m">−6…−18       night_ok or ×0.5</text>
<text x="738" y="318" class="m">&lt; −18        night_ok only</text>
<text x="738" y="332" class="m">lightning exempt · aurora &lt;−12</text>
<text x="738" y="348" class="lbl">straddles dusk → union both ends</text>

<line x1="958" y1="306" x2="978" y2="306"/>
<rect x="980" y="256" width="250" height="100" class="box"/>
<text x="990" y="274" class="s" font-weight="700">score &amp; rank</text>
<text x="990" y="290" class="m">geo_fit + freshness + sky_frac</text>
<text x="990" y="304" class="m">+ source_prior + night_mult</text>
<text x="990" y="318" class="m">+ profile.prefer bonuses</text>
<text x="990" y="332" class="m">− dup_penalty (same spot)</text>
<text x="990" y="348" class="lbl">top 3k (≤9) with reason string + URLs</text>

<rect x="1250" y="256" width="218" height="100" class="box fail"/>
<text x="1260" y="274" class="s red" font-weight="700">0 rows after ① →</text>
<text x="1260" y="292" class="m">NO_CAMERAS_IN_RANGE</text>
<text x="1260" y="306" class="s">(drop; don't re-poll)</text>
<text x="1260" y="324" class="m">CAMERAS_DARK</text>
<text x="1260" y="338" class="s">(retry after sunrise,</text>
<text x="1260" y="352" class="s"> unless aurora/lightning)</text>
<path class="no" d="M1230,306 L1248,306"/>

<!-- arrows into row 1 -->
<path class="f" d="M185,180 L185,220"/>
<path class="f" d="M565,180 L565,220"/>
<path class="f" d="M1130,180 L1130,220"/>
<text x="192" y="205" class="lbl">event</text>
<text x="572" y="205" class="lbl">reads parquet</text>
<text x="1137" y="205" class="lbl">profile(type)</text>

<!-- ============ ROW 2: fetch + cheap gates ============ -->
<path class="f" d="M750,370 L750,400"/>
<text x="758" y="390" class="lbl">≤ 9 candidates</text>

<rect x="20" y="400" width="1460" height="190" class="box gate"/>
<text x="32" y="422" class="t">② fetch frames + cheap gates (no LLM) · concurrent httpx, 5 s timeout · p50 1.2 s (JPEG), +2–5 s if HLS · verdict cached per (camera, 10-min bucket)</text>

<rect x="32" y="436" width="230" height="140" class="box"/>
<text x="42" y="454" class="s" font-weight="700">get a frame (profile.media_pref)</text>
<text x="42" y="470" class="m">jpeg  GET image_url?t=…</text>
<text x="42" y="484" class="m">hls   m3u8 → last seg → ffmpeg 1 fr</text>
<text x="42" y="498" class="m">      lightning: 15–20 s burst</text>
<text x="42" y="512" class="m">embed yt-dlp -g → hls (cache 1 h)</text>
<text x="42" y="526" class="m">page  no frame → iframe-only,</text>
<text x="42" y="540" class="m">      verified=false, ts from JSON</text>
<text x="42" y="566" class="lbl">rights: ALERTCA/Windy never cached</text>

<line x1="262" y1="506" x2="282" y2="506"/>
<rect x="284" y="436" width="200" height="140" class="box"/>
<text x="294" y="454" class="s" font-weight="700">bytes</text>
<text x="294" y="470" class="m">200 · content-type image/*</text>
<text x="294" y="484" class="m">≥3 KB · FFD8…FFD9 · PIL.verify</text>
<text x="294" y="504" class="s" font-weight="700">placeholder</text>
<text x="294" y="520" class="m">sha1 ∈ per-source offline set</text>
<text x="294" y="540" class="s" font-weight="700">frozen</text>
<text x="294" y="556" class="m">pHash ≈ last sample &amp;</text>
<text x="294" y="570" class="m">now − last_ts &gt; 3·refresh_s</text>

<line x1="484" y1="506" x2="504" y2="506"/>
<rect x="506" y="436" width="200" height="140" class="box"/>
<text x="516" y="454" class="s" font-weight="700">timestamp</text>
<text x="516" y="470" class="m">source JSON → EXIF →</text>
<text x="516" y="484" class="m">Last-Modified → fetch time</text>
<text x="516" y="498" class="m">reject if &gt; 2·refresh_s old</text>
<text x="516" y="518" class="s" font-weight="700">clock skew</text>
<text x="516" y="534" class="s">bytes changed but ts says</text>
<text x="516" y="548" class="s">stale → trust bytes,</text>
<text x="516" y="562" class="m">ts_source='inferred'</text>

<line x1="706" y1="506" x2="726" y2="506"/>
<rect x="728" y="436" width="230" height="140" class="box"/>
<text x="738" y="454" class="s" font-weight="700">pixels (256-px sky crop, &lt;5 ms)</text>
<text x="738" y="470" class="m">mean lum &lt; 12/255 → reject</text>
<text x="738" y="484" class="m">  (except aurora, lightning)</text>
<text x="738" y="498" class="m">std &lt; 4 → uniform → reject</text>
<text x="738" y="512" class="m">Laplacian var &lt; 15 → penalise</text>
<text x="738" y="526" class="m">  (skipped for fog/undercast)</text>
<text x="738" y="546" class="s" font-weight="700">dedupe across cams</text>
<text x="738" y="562" class="m">pHash dist ≤ 4 → keep best score</text>

<line x1="958" y1="506" x2="978" y2="506"/>
<rect x="980" y="436" width="200" height="140" class="box"/>
<text x="990" y="454" class="s" font-weight="700">re-rank → top ≤ 6</text>
<text x="990" y="470" class="m">score·(1 + 0.2·sharpness)</text>
<text x="990" y="494" class="s" font-weight="700">CLIP pre-gate (optional, CPU)</text>
<text x="990" y="510" class="m">open_clip ViT-B/32, 10 ms</text>
<text x="990" y="524" class="s">"offline card / black / road at</text>
<text x="990" y="538" class="s">night" → drop before paying</text>
<text x="990" y="562" class="lbl">Token Company: log fetched vs sent</text>

<rect x="1200" y="436" width="268" height="140" class="box fail"/>
<text x="1210" y="454" class="s red" font-weight="700">every frame failed a gate →</text>
<text x="1210" y="472" class="m">ALL_STALE   (retry in 10 min)</text>
<text x="1210" y="490" class="m">TIMEOUT     (30 s deadline; returns</text>
<text x="1210" y="504" class="m">             partial, verified=false)</text>
<text x="1210" y="528" class="s">rejected frames written to</text>
<text x="1210" y="542" class="m">camera_samples.vlm_label =</text>
<text x="1210" y="556" class="m">'rejected:&lt;gate&gt;'</text>
<text x="1210" y="570" class="s">→ health job / placeholder set learn</text>
<path class="no" d="M1180,506 L1198,506"/>

<!-- ============ ROW 3: VLM ============ -->
<path class="f" d="M750,590 L750,620"/>
<text x="758" y="610" class="lbl">≤ 6 frames (lightning: max-projection composite + median)</text>

<rect x="20" y="620" width="1460" height="170" class="box vlm"/>
<text x="32" y="642" class="t">③ VLM gate · OpenAI mini-tier, structured output, detail:"low", ≤ 6 concurrent calls, p50 2 s</text>

<rect x="32" y="656" width="420" height="120" class="box"/>
<text x="42" y="674" class="s" font-weight="700">prompt</text>
<text x="42" y="690" class="s">fixed system msg + target type + one-line definition</text>
<text x="42" y="704" class="s">+ sun_az &amp; cam.azimuth (sunset) · asks what it DOES see,</text>
<text x="42" y="718" class="s">not yes/no on target → fewer sycophantic positives</text>
<text x="42" y="740" class="s" font-weight="700">escalate ≤ 1× per event to the large model</text>
<text x="42" y="756" class="s">when unsure, or type ∈ {mammatus, lenticular, aurora} &amp; conf &lt; 0.6</text>

<line x1="452" y1="716" x2="472" y2="716"/>
<rect x="474" y="656" width="330" height="120" class="box"/>
<text x="484" y="674" class="s" font-weight="700">Verdict (pydantic)</text>
<text x="484" y="690" class="m">usable: bool     sky_visible: 0..1   night: bool</text>
<text x="484" y="704" class="m">event_visible: yes|partial|no|unsure</text>
<text x="484" y="718" class="m">event_type_seen: &lt;10 types&gt;|none|other</text>
<text x="484" y="732" class="m">confidence: 0..1   quality: 1..5</text>
<text x="484" y="746" class="m">caption: ≤12 words   burned_in_time?</text>
<text x="484" y="768" class="lbl">verdict → camera_samples → night_ok / quality_score feedback</text>

<line x1="804" y1="716" x2="824" y2="716"/>
<rect x="826" y="656" width="360" height="120" class="box"/>
<text x="836" y="674" class="s" font-weight="700">pass / pick order</text>
<text x="836" y="690" class="m">pass iff usable ∧ event_visible ∈ {yes, partial}</text>
<text x="836" y="704" class="m">      ∧ event_type_seen == target ∧ conf ≥ 0.5</text>
<text x="836" y="722" class="m">order = conf · (0.6 + 0.1·quality)</text>
<text x="836" y="736" class="s">→ top k (=3) pass on to routing</text>

<rect x="836" y="744" width="340" height="28" class="box later"/>
<text x="846" y="763" class="lbl">LATER · best view: multi-frame prompt, offline → quality_score</text>

<rect x="1200" y="656" width="268" height="120" class="box fail"/>
<text x="1210" y="674" class="s red" font-weight="700">fresh frames, VLM says no →</text>
<text x="1210" y="692" class="m">NO_FOOTAGE_FOUND</text>
<text x="1210" y="708" class="s">the labelled negative worth keeping</text>
<text x="1210" y="722" class="s">(Voloridge / backtest)</text>
<text x="1210" y="744" class="m">EVENT_NOT_VISIBLE</text>
<text x="1210" y="758" class="s">only 'partial'/'unsure' → retry 10 min</text>
<path class="no" d="M1186,716 L1198,716"/>

<!-- ============ ROW 4: route ============ -->
<path class="f" d="M750,790 L750,820"/>
<text x="758" y="810" class="lbl">k verified (camera, frame, verdict)</text>

<rect x="20" y="820" width="1460" height="200" class="box route"/>
<text x="32" y="842" class="t">④ route · one universal Footage envelope, three renderers · store + SSE · hold &amp; cheap re-verify</text>

<rect x="32" y="856" width="440" height="150" class="box"/>
<text x="42" y="874" class="s" font-weight="700">Footage (what the frontend gets, same shape for every source)</text>
<text x="42" y="890" class="m">{event_id, camera_id, rank, verified,</text>
<text x="42" y="904" class="m"> media:{kind: image|hls|iframe, src: /proxy/…, poster,</text>
<text x="42" y="918" class="m">        refresh_s, expires_at, width, height},</text>
<text x="42" y="932" class="m"> verdict:{event_visible, confidence, quality, caption},</text>
<text x="42" y="946" class="m"> why: "18 km NE of core, faces 225°, base at ~35°",</text>
<text x="42" y="960" class="m"> camera:{name, lat, lon, source, page_url, attribution, license},</text>
<text x="42" y="974" class="m"> frame_ts, hold_until}</text>
<text x="42" y="996" class="lbl">image ≈ 90 % of catalog and the only path that is cheaply VLM-verified</text>

<line x1="472" y1="930" x2="492" y2="930"/>
<rect x="494" y="856" width="250" height="150" class="box"/>
<text x="504" y="874" class="s" font-weight="700">proxy /proxy/frame|hls/{camera_id}</text>
<text x="504" y="890" class="s">fixes CORS (.gov/DOT block browsers)</text>
<text x="504" y="904" class="s">rewrites HLS segment URIs</text>
<text x="504" y="918" class="s">Cache-Control = refresh_s for .gov/CC-BY</text>
<text x="504" y="932" class="s">no-store pass-through: ALERTCA (NC-ND),</text>
<text x="504" y="946" class="s">Windy (re-resolve signed URL near expiry)</text>
<text x="504" y="960" class="s">Panomax: iframe for display, JPEG only</text>
<text x="504" y="974" class="s">for the VLM</text>

<line x1="744" y1="930" x2="764" y2="930"/>
<rect x="766" y="856" width="250" height="150" class="box"/>
<text x="776" y="874" class="s" font-weight="700">store + push</text>
<text x="776" y="890" class="m">aiosqlite, key = event_id</text>
<text x="776" y="904" class="m">GET /feed            top-N pairs</text>
<text x="776" y="918" class="m">GET /events/{id}/footage</text>
<text x="776" y="932" class="m">GET /stream  (SSE) {event_id,status}</text>
<text x="776" y="954" class="s" font-weight="700">hold &amp; re-verify</text>
<text x="776" y="970" class="s">visible for profile.hold_s (10–30 min);</text>
<text x="776" y="984" class="s">every reverify_s re-run ② only; black/</text>
<text x="776" y="998" class="s">frozen → demote + ALL_STALE upstream</text>

<line x1="1016" y1="930" x2="1036" y2="930"/>
<rect x="1038" y="856" width="430" height="150" class="box ext"/>
<text x="1048" y="874" class="t">Frontend (other team)</text>
<text x="1048" y="892" class="m">image  → &lt;img&gt; re-request every refresh_s     ~0.3 s</text>
<text x="1048" y="908" class="m">hls    → hls.js, poster = verified still        2–4 s</text>
<text x="1048" y="924" class="m">iframe → YouTube/Panomax embed, verified=false  3–6 s</text>
<text x="1048" y="946" class="s">shows: event badge · caption · "why this camera" · attribution</text>
<text x="1048" y="960" class="s">never talks to cameras directly → live and replay look identical</text>
<text x="1048" y="984" class="s" font-weight="700">time to first verified frame on screen:</text>
<text x="1048" y="1000" class="s">≈4 s p50 (JPEG) · 10–15 s (HLS/YouTube) · +15–20 s lightning · 30 s cap</text>

<!-- ============ ROW 5: status back ============ -->
<rect x="20" y="1050" width="1460" height="90" class="box ext"/>
<text x="32" y="1072" class="t">FootageResult → weather backend (always returned, success or not)</text>
<text x="32" y="1092" class="m">{event_id, status, footage[0..k], candidates, checked, vlm_calls, tokens_in, elapsed_ms, retry_after_s, reason}</text>
<text x="32" y="1112" class="s">status semantics: FOOTAGE_FOUND · NO_FOOTAGE_FOUND (fresh frames, event not seen) · NO_CAMERAS_IN_RANGE (drop) · CAMERAS_DARK (defer to daylight) · ALL_STALE / EVENT_NOT_VISIBLE / TIMEOUT (retry ~10 min)</text>
<text x="32" y="1130" class="s">feasibility order for the demo: A thunderstorm · fog · undercast · lenticular → B mammatus · aurora → C lightning · rainbow → D sunrise / sunset (exact heading + weather-side quality + repeated fetch + best-view ranking)</text>

<!-- red return arrows from fail boxes to the status row -->
<path class="no" d="M1359,356 L1359,392"/>
<path class="no" d="M1359,576 L1359,612"/>
<path class="no" d="M1359,776 L1359,812"/>
<path class="no" d="M1490,306 L1490,1095 L1481,1095" />
<path class="no" d="M1468,306 L1490,306"/>
<path class="no" d="M1468,506 L1490,506"/>
<path class="no" d="M1468,716 L1490,716"/>
<path class="f" d="M750,1020 L750,1050"/>
<text x="758" y="1040" class="lbl">FOOTAGE_FOUND + counters</text>
</svg>
