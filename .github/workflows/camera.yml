name: camera

on:
  push:
    branches: [main]
    paths: ["camera/**", ".github/workflows/camera.yml"]
  pull_request:
    paths: ["camera/**", ".github/workflows/camera.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: camera
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: camera/uv.lock
      - run: uv sync --extra dev
      - run: uv run ruff check src tests
      - run: uv run pytest -q
